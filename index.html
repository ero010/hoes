    else if (k === "t") { x = a.t ? new Date(a.t).getTime() : NULLKEY; y = b.t ? new Date(b.t).getTime() : NULLKEY; }
    else if (k === "a") { x = a.t ? rawAge(a.t) : NULLKEY; y = b.t ? rawAge(b.t) : NULLKEY; }
    else { x = a.n||""; y = b.n||""; }
    if (x===Infinity && y===Infinity) return 0;
    if (x===Infinity && y!==Infinity) return 1;
    if (x!==Infinity && y===Infinity) return -1;
    if (x < y) return -1*mult; if (x > y) return 1*mult; return 0;
  });
  return arr;
}

function render() {
  const arr = filtered();
  const tb = document.querySelector("#t tbody");
  const rows = arr.map(r => {
    const id = adId(r);
    const val = notes[id] !== undefined ? esc(notes[id]) : "";
    return "<tr data-id=\"" + id + "\">" +
      "<td class='nom'><a href='" + esc(r.u) + "' target='_blank' rel='noopener noreferrer'>" + esc(r.n || "(sans titre)") + "</a></td>" +
      "<td>" + esc(r.c) + "</td>" +
      "<td>" + esc(r.p) + "</td>" +
      "<td class='v'>" + fmtViews(r.v) + "</td>" +
      "<td>" + fmtDate(r.t) + "</td>" +
      "<td>" + fmtAge(r.t) + "</td>" +
      "<td class='td-note'><input class='note' type='number' inputmode='decimal' data-aid='" + id + "' value='" + val + "'></td>" +
      "</tr>";
  }).join("");
  tb.innerHTML = rows;
}

document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.getElementById("sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
document.querySelectorAll("#t thead th").forEach(th => {
  const k = th.dataset.k;
  if (!k) return;
  th.addEventListener("click", () => {
    const [ck, cd] = state.sort.split("-");
    let dir = "d";
    if (ck === k && cd === "d") dir = "a";
    state.sort = k + "-" + dir;
    document.querySelectorAll("#t thead th .arrow").forEach(a => a.textContent = "");
    th.querySelector(".arrow").textContent = dir === "d" ? "\u25BC" : "\u25B2";
    render();
  });
});
document.getElementById("t").addEventListener("input", e => {
  if (e.target.classList.contains("note")) {
    const id = e.target.dataset.aid;
    notes[id] = e.target.value;
    try { localStorage.setItem(LS_KEY, JSON.stringify(notes)); } catch (err) {}
  }
});
render();
</script>
</body>
</html>
